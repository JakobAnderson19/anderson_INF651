<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Budget | BudgetTracker</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body>


<!-- Navigation -->

<nav class="navbar">

    <h1 class="logo">
        BudgetTracker
    </h1>


    <ul class="nav-links">

        <li>
            <a href="index.html">
                Home
            </a>
        </li>


        <li>
            <a href="transactions.html">
                Transactions & Income
            </a>
        </li>


        <li>
            <a href="budget.html">
                Budget
            </a>
        </li>


        <li>
            <a href="savings.html">
                Savings
            </a>
        </li>

    </ul>

</nav>



<main>


<section class="hero">

    <h2>
        Monthly Budget
    </h2>


    <p>
        Create spending limits and track your monthly expenses.
    </p>

</section>



<!-- Budget Creation -->

<section class="budget-setup">


    <h3>
        Create Budget Category
    </h3>


    <p>
        Set a monthly spending limit for a category.
    </p>



    <label for="budget-category">
        Category
    </label>


    <select id="budget-category">


        <option value="Housing">
            Housing
        </option>


        <option value="Food">
            Food
        </option>


        <option value="Transportation">
            Transportation
        </option>


        <option value="Entertainment">
            Entertainment
        </option>


        <option value="Bills">
            Bills
        </option>


        <option value="Other">
            Other
        </option>


    </select>

    <label for="custom-budget-category">

        Or Create New Category

    </label>


    <input
        type="text"
        id="custom-budget-category"
        placeholder="Enter new category"
    />

    <button id="remove-category-btn">

        Remove Custom Category

    </button>




    <label for="budget-limit">
        Monthly Limit
    </label>


    <input 
        type="number"
        id="budget-limit"
        placeholder="Enter amount"
    >



    <button id="create-budget-btn">
        Create Budget
    </button>



    <p id="budget-message"></p>


</section>




<!-- Budget Cards -->

<section class="budget-container">


    <h3>
        Your Budgets
    </h3>


    <div id="budget-list" class="budget-cards">


        <!-- Budget cards created here -->


    </div>


</section>

<!-- Edit Budget Box -->

<section id="edit-budget-box" class="budget-edit-box">


    <h3>
        Edit Budget
    </h3>


    <label for="edit-budget-limit">

        New Monthly Limit

    </label>


    <input 
        type="number"
        id="edit-budget-limit"
    >



    <button id="save-budget-edit">

        Save Changes

    </button>


    <button id="cancel-budget-edit">

        Cancel

    </button>


</section>



</main>




<footer>

    <p>
        © 2026 BudgetTracker
    </p>

</footer>



<script src="scripts.js"></script>


</body>

</html>
