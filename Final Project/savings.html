<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Savings | BudgetTracker</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body>


<!-- Navigation -->

<nav class="navbar">

    <h1 class="logo">
        BudgetTracker
    </h1>


    <ul class="nav-links">


        <li>
            <a href="index.html">
                Home
            </a>
        </li>


        <li>
            <a href="transactions.html">
                Transactions & Income
            </a>
        </li>


        <li>
            <a href="budget.html">
                Budget
            </a>
        </li>


        <li>
            <a href="savings.html">
                Savings
            </a>
        </li>


    </ul>

</nav>




<main>


<section class="hero">

    <h2>
        Savings Goals
    </h2>


    <p>
        Create savings goals and track your progress.
    </p>


</section>

<!-- Savings Goal Creation -->

<section class="savings-setup">


    <h3>
        Create Savings Goal
    </h3>


    <label for="savings-name">

        Goal Name

    </label>


    <input
        type="text"
        id="savings-name"
        placeholder="Emergency Fund"
    >



    <label for="savings-target">

        Target Amount

    </label>


    <input
        type="number"
        id="savings-target"
        placeholder="Enter amount"
    >



    <button id="create-savings-btn">

        Create Goal

    </button>


    <p id="savings-message"></p>


</section>

<!-- Savings Goals Display -->

<section class="savings-container">


    <h3>
        Your Savings Goals
    </h3>


    <div class="savings-content">


        <div id="savings-list" class="savings-cards">


            <!-- Savings cards appear here -->


        </div>



        <div
        id="edit-savings-box"
        class="edit-savings-panel"
        style="display:none;">


            <h3>
                Edit Savings Goal
            </h3>


            <label>
                Goal Name
            </label>


            <input
                type="text"
                id="edit-savings-name">



            <label>
                Target Amount
            </label>


            <input
                type="number"
                id="edit-savings-target">



            <button id="save-savings-edit">

                Save Changes

            </button>



            <button id="cancel-savings-edit">

                Cancel

            </button>


        </div>


    </div>


</section>

<div class="savings-calculator-card">

    <h3>
        Savings Goal Calculator
    </h3>

    <div class="calculator-mode">

        <label class="mode-option">

            <span>
                How long until I reach my goal?
            </span>

            <input 
            type="radio" 
            name="calculator-mode"
            id="time-to-goal-mode"
            checked>

        </label>


        <label class="mode-option">

            <span>
                How much do I need per paycheck?
            </span>

            <input 
            type="radio" 
            name="calculator-mode"
            id="required-savings-mode">

        </label>

    </div>

    <label>
        Select Savings Goal:
    </label>

    <select id="calculator-savings-goal">
        <option value="">
            Select a goal
        </option>
    </select>


    <div id="paycheck-input-section">

        <label>
            Savings Per Paycheck:
        </label>

        <input 
        type="number"
        id="calculator-amount"
        placeholder="Amount saved">

    </div>

    <div id="timeframe-input-section"
style="display:none;">


    <label>
        Time To Save:
    </label>


    <input 
        type="number"
        id="calculator-timeframe"
        placeholder="Number">


        <select id="calculator-time-unit">

            <option value="months">
                Months
            </option>

            <option value="years">
                Years
            </option>

        </select>


    </div>


    <label>
        Pay Frequency:
    </label>

    <select id="calculator-frequency">

        <option value="52">
            Weekly
        </option>

        <option value="26">
            Every 2 weeks
        </option>

        <option value="24">
            Twice a month
        </option>

        <option value="12">
            Monthly
        </option>

    </select>


    <button id="calculate-savings-btn">
        Calculate
    </button>


    <div id="calculator-result">

    </div>


</div>

</main>




<footer>

    <p>
        © 2026 BudgetTracker
    </p>


</footer>



<script src="scripts.js"></script>


</body>

</html>
